name: daily

on:
  schedule:
    - cron: "17 1 * * *" # 09:17（台北）主發前一天
    - cron: "23 13 * * *" # 21:23（台北）補查；已發過則無動作
  workflow_dispatch:
    inputs:
      date:
        description: "強制重發指定日期 YYYY-MM-DD（留空 = 自動偵測）"
        required: false
      backfill:
        description: "補發最近 N 個已結束日（跳過已發；留空 = 不補發）"
        required: false

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest # 標準 runner；larger runner 即使公開 repo 也會收費，勿改
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, convert, send
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DATE: ${{ inputs.date }}
          BACKFILL: ${{ inputs.backfill }}
        run: python cid_daily_tg.py ${DATE:+--date "$DATE"} ${BACKFILL:+--backfill "$BACKFILL"}

      - name: Commit state
        if: always() # 中途失敗也要把已完成的進度寫回，避免重跑重複發
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update state"
            git pull --rebase
            git push
          fi
